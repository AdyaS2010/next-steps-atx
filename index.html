<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#286343" />
    <meta
      name="description"
      content="Next Steps ATX, the Austin Benefits Navigator: find local help for food, housing, healthcare, bills, transportation, work, and family needs, plus career and money tools. Confirm your details, choose useful next steps, and connect with official providers. English and Spanish, with a private local guide and optional AI assistance."
    />
    <title>Next Steps ATX · Austin Benefits Navigator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
